<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container {
            height: 200px;
            width: 200px ;
            display: flex;
            flex-wrap: wrap;
            border: 2px solid red;
            justify-content: center;
            flex-direction: column;
            margin-left: 150px;
            gap: 10px;
            margin-top: 100px;
            
        }
        .item {
            width: 40px;
            height: 20px;
            border: 2px solid #000;
            margin-left: 80px;
            background-color: rgb(108, 153, 167);

           
        }
         nav {
            background-color: #585858;
            border: 2px solid #000;
        }
        nav ul {
            list-style-type: none;
            margin: 0;
            padding: 0;
            display: flex;
        }
        nav ul li {
            margin-right: 50px;
        }
        nav ul li a {
            color: white;
            text-decoration: none;
            padding: 10px 15px;
            display: block;
        }
        nav ul li a:hover {
            background-color: #555;
        }
   

       
    </style>
</head>
<body>
   
   <nav>
        <ul>
            <li><a href="#">Home</a></li>                               
            <li><a href="#">About</a></li>
            <li><a href="#">Services</a></li>
            <li><a href="#">Contact</a></li>
        </ul>
    </nav>
